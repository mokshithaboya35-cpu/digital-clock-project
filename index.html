<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock-card">
    <p class="eyebrow">DIGITAL CLOCK</p>
    <h1 id="time" aria-live="off">00:00:00</h1>
    <p id="date">Loading date...</p>
    <div class="controls">
      <button id="formatButton" type="button">Switch to 24-hour</button>
    </div>
    <p class="note">Your local device time</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
